# DVF-ACLP: Anycubic Kossel Linear Plus + BTT SKR Pico v1.0 + Raspberry Pi 3B (Klipper)
# Based on Klipper's printer-anycubic-kossel-plus-2017.cfg and generic-bigtreetech-skr-pico-v1.0.cfg
# Stock motors, 20T GT2 pulleys, 12 V stock PSU, stock heated bed, hotend and Z-probe.
#
# !! After installing the new effector run DELTA_CALIBRATE: its geometry differs from stock !!
# !! Check every heater/thermistor reading before the first heat-up.                        !!

[include mainsail.cfg]

[mcu]
# ls /dev/serial/by-id/   then paste your id here
serial: /dev/serial/by-id/usb-Klipper_rp2040_CHANGE_ME-if00

[printer]
kinematics: delta
max_velocity: 300
max_accel: 3000
max_z_velocity: 150
delta_radius: 134.4
print_radius: 115
minimum_z_position: -5

# ---------------- towers (A = X socket, B = Z socket, C = Y socket) --------
[stepper_a]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio4
homing_speed: 50
homing_retract_dist: 5
position_endstop: 295.6
arm_length: 269.0

[stepper_b]
step_pin: gpio19
dir_pin: !gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio25

[stepper_c]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio3

[tmc2209 stepper_a]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.8
stealthchop_threshold: 0

[tmc2209 stepper_b]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.8
stealthchop_threshold: 0

[tmc2209 stepper_c]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.8
stealthchop_threshold: 0

# ---------------- extruder (stock Bowden) ----------------------------------
[extruder]
step_pin: gpio14
dir_pin: !gpio13
enable_pin: !gpio15
microsteps: 16
rotation_distance: 33.333   # calibrate e-steps
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio23
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio27
control: pid
pid_Kp: 25.349
pid_Ki: 1.216
pid_Kd: 132.130
min_extrude_temp: 170
min_temp: 0
max_temp: 260
pressure_advance: 0.4       # Bowden starting point, tune it

[tmc2209 extruder]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 3
run_current: 0.6
stealthchop_threshold: 0

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
control: pid
pid_kp: 73.517
pid_ki: 1.132
pid_kd: 1193.728
min_temp: 0
max_temp: 110

# ---------------- fans ----------------------------------------------------
[fan]                       # 5015 part fan -> FAN1
pin: gpio17
kick_start_time: 0.2

[heater_fan hotend_fan]     # 3010 heatsink fan -> FAN2
pin: gpio18
heater: extruder
heater_temp: 50.0

[controller_fan electronics_fan]   # 4010 on the electronics plate -> FAN3
pin: gpio20
idle_timeout: 120

# ---------------- stock Anycubic clip-on Z probe -> Z-probe/servo header ----
[probe]
pin: ^gpio22
x_offset: 0
y_offset: 0
z_offset: 15.9   # measure yours (PROBE_CALIBRATE)
speed: 5
samples: 3
sample_retract_dist: 5
samples_result: median

[delta_calibrate]
radius: 100
horizontal_move_z: 25

[bed_mesh]
speed: 80
horizontal_move_z: 25
mesh_radius: 95
mesh_origin: 0, 0
round_probe_count: 7

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

[temperature_sensor skr_pico]
sensor_type: temperature_mcu

[idle_timeout]
timeout: 600

[exclude_object]
